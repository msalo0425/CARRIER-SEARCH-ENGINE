<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Orange rounded background -->
  <rect width="32" height="32" rx="7" fill="#F96B2F"/>
  <!-- Outer black circle (badge ring) -->
  <circle cx="16" cy="16" r="14" fill="#111111"/>
  <!-- White inner circle -->
  <circle cx="16" cy="16" r="11" fill="white"/>
  <!-- Four-leaf clover: 4 circles in cross pattern -->
  <circle cx="16" cy="12" r="3.8" fill="#111111"/>
  <circle cx="16" cy="20" r="3.8" fill="#111111"/>
  <circle cx="12" cy="16" r="3.8" fill="#111111"/>
  <circle cx="20" cy="16" r="3.8" fill="#111111"/>
  <!-- Stem -->
  <rect x="15.2" y="19.5" width="1.6" height="3.5" rx="0.8" fill="#111111"/>
</svg>
